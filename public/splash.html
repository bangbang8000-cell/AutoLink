<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoLink</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    .splash {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0c4a6e 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      position: relative;
    }
    /* Animated background particles */
    .particles {
      position: absolute; inset: 0;
      overflow: hidden; pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: rgba(125, 211, 252, 0.4);
      border-radius: 50%;
      animation: float 8s infinite ease-in-out;
    }
    .particle:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 80%; top: 15%; animation-delay: 1s; }
    .particle:nth-child(3) { left: 25%; top: 75%; animation-delay: 2s; }
    .particle:nth-child(4) { left: 70%; top: 80%; animation-delay: 3s; }
    .particle:nth-child(5) { left: 50%; top: 10%; animation-delay: 4s; }
    .particle:nth-child(6) { left: 10%; top: 50%; animation-delay: 5s; }
    .particle:nth-child(7) { left: 90%; top: 50%; animation-delay: 6s; }
    .particle:nth-child(8) { left: 40%; top: 90%; animation-delay: 7s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
      50% { transform: translateY(-30px) scale(1.5); opacity: 0.8; }
    }

    /* Logo container */
    .logo-wrap {
      position: relative;
      width: 120px; height: 120px;
      margin-bottom: 24px;
    }
    .logo-svg {
      width: 100%; height: 100%;
      animation: logoIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes logoIn {
      0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    /* Rotating ring around logo */
    .ring {
      position: absolute; inset: -8px;
      border: 2px solid transparent;
      border-top-color: #7dd3fc;
      border-right-color: #a78bfa;
      border-radius: 20px;
      animation: spin 2s linear infinite;
      opacity: 0.6;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* App name */
    .app-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #7dd3fc, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeIn 0.8s 0.2s both;
    }
    .app-subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
      letter-spacing: 1px;
      animation: fadeIn 0.8s 0.4s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loading indicator */
    .loader {
      margin-top: 36px;
      display: flex; align-items: center; gap: 8px;
      animation: fadeIn 0.8s 0.6s both;
    }
    .loader-dots {
      display: flex; gap: 6px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #7dd3fc;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    .loader-text {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1px;
    }

    /* Progress bar */
    .progress-wrap {
      margin-top: 20px;
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      animation: fadeIn 0.8s 0.8s both;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #7dd3fc, #a78bfa);
      border-radius: 2px;
      animation: progress 2.5s ease-in-out;
    }
    @keyframes progress {
      0% { width: 0%; }
      30% { width: 30%; }
      50% { width: 50%; }
      70% { width: 70%; }
      100% { width: 95%; }
    }

    /* Version */
    .version {
      position: absolute;
      bottom: 16px;
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="particles">
      <div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div>
    </div>

    <div class="logo-wrap">
      <div class="ring"></div>
      <svg class="logo-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0EA5E9"/>
            <stop offset="100%" stop-color="#2563EB"/>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)"/>
        <g filter="url(#glow)">
          <path d="M 160 392 L 256 120 L 352 392" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <path d="M 112 260 L 400 260" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
        <g fill="#FFFFFF">
          <circle cx="256" cy="120" r="18"/>
          <circle cx="160" cy="392" r="18"/>
          <circle cx="352" cy="392" r="18"/>
          <circle cx="112" cy="260" r="18"/>
          <circle cx="400" cy="260" r="18"/>
        </g>
      </svg>
    </div>

    <div class="app-name">AutoLink</div>
    <div class="app-subtitle">AI 智算中心网络规划与可视化工具</div>

    <div class="loader">
      <div class="loader-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <span class="loader-text">加载中...</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <div class="version">v2.5.0</div>
  </div>
</body>
</html>
