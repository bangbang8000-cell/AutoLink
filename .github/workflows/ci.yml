name: CI
on:
  push:
    branches: [main]
  pull_request:
  # V2.9.9-T4: 支持手动触发 CI（验证 validate_templates 步骤等）
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:renderer
      # V2.9.8-T3: 模板验证纳入 CI — 16 内置模板损坏时构建失败
      - run: python scripts/validate_templates.py
      # V3.0.0-T0-1: golden 基线比对 — 拓扑引擎结构变化（节点/连接/机柜/校验）时 CI 失败
      - run: python scripts/gen_golden.py --check
