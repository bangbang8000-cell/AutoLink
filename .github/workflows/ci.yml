name: CI
on:
  push:
    branches: [main]
    # V3.0.0-T0-9: 打 v* 标签触发发布编译（产出 Windows 安装包并发布 GitHub Release）
    tags: ['v*']
  pull_request:
  # V2.9.9-T4: 支持手动触发 CI（验证 validate_templates 步骤等）
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      # V3.0.0-T0-7: 开发/测试依赖（含运行时 + pytest + pyinstaller）
      - run: pip install -r backend/requirements-dev.txt
      - run: npm run typecheck
      - run: npm run lint
      # V3.0.0-T0-8: 前端单测（vitest，含 python.service 持久 Agent 集成测试）
      - run: npm test
      - run: npm run build:renderer
      # V3.0.0-T0-8: Electron 主进程/preload 编译门禁
      - run: npm run build:electron
      # V2.9.8-T3: 模板验证纳入 CI — 16 内置模板损坏时构建失败
      - run: python scripts/validate_templates.py
      # V3.0.0-T0-1: golden 基线比对 — 拓扑引擎结构变化（节点/连接/机柜/校验）时 CI 失败
      - run: python scripts/gen_golden.py --check
      # V3.0.0-T0-8: 后端全量 pytest
      - run: python -m pytest tests/backend -q

  # V3.0.0-T0-9: 发布编译 — 打 v* 标签时在 Windows 上产出 NSIS 安装包并发布 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r backend/requirements-dev.txt
      - run: npm run build:renderer
      - run: npm run build:electron
      # 后端 PyInstaller 单目录打包（engine + template，python.service 免 Python 运行）
      - run: python -m PyInstaller scripts/pyinstaller.spec
      # 打包 Windows NSIS 安装包并发布 GitHub Release（electron-builder 使用 GITHUB_TOKEN）
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 同步上传安装包为 Actions artifact，便于直接从工作流页面下载
      - uses: actions/upload-artifact@v4
        with:
          name: autolink-setup-win-x64
          path: release/AutoLink-Setup-*-win.exe
