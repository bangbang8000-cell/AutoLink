name: CI
on:
  push:
    branches: [main]
  pull_request:
  # V2.9.9-T4: 支持手动触发 CI（验证 validate_templates 步骤等）
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      # V3.0.0-T0-7: 开发/测试依赖（含运行时 + pytest + pyinstaller）
      - run: pip install -r backend/requirements-dev.txt
      - run: npm run typecheck
      - run: npm run lint
      # V3.0.0-T0-8: 前端单测（vitest，含 python.service 持久 Agent 集成测试）
      # 4.6.0-F6-1: 前端覆盖率门禁（阈值 ≥40/40/35/32，低于即失败）+ junit/coverage-summary 产物
      - run: npm run test:report
      - run: npm run build:renderer
      # V3.0.0-T0-8: Electron 主进程/preload 编译门禁
      - run: npm run build:electron
      # V3.2.2-R11.1: 渲染层安全断言 — 0 直接网络 / 0 Node 访问（一切经 preload IPC 桥接）
      - name: Security baseline (renderer IPC-only)
        run: |
          # 仅扫描打包进渲染层的源码；src/test 为测试代码（合法使用 Node API），不属渲染层，排除
          if grep -rEn --exclude-dir=test "\bfetch\(|XMLHttpRequest|require\(|process\." src --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"; then
            echo "FAIL: renderer must not access network or Node APIs directly"
            exit 1
          fi
          echo "PASS: renderer is isolated (IPC-only)"
      # V2.9.8-T3: 模板验证纳入 CI — 16 内置模板损坏时构建失败
      - run: python scripts/validate_templates.py
      # V3.0.0-T0-1: golden 基线比对 — 拓扑引擎结构变化（节点/连接/机柜/校验）时 CI 失败
      - run: python scripts/gen_golden.py --check
      # V3.0.0-T0-8: 后端全量 pytest
      # 4.6.0-F6-1: 后端覆盖率门禁（.coveragerc fail_under=55，低于即失败）+ junit/coverage-json 产物
      - run: python -m pytest tests/backend -q --cov=backend --cov-report=term --cov-fail-under=55 --cov-report=json:reports/coverage-backend.json --junitxml=reports/pytest.xml
      # V3.2.2-R11.3: 关键路径性能门禁（2048 GPU 设计 ≤30s、225 柜落位 ≤5s，超限退出码 1）
      - run: python scripts/bench_perf.py --rounds 1
      # 4.6.0-F6-3: 统一测试报告（聚合 pytest/vitest/golden/bench/模板校验 → reports/）
      # 4.6.0-F6-1: 覆盖率门禁（阈值 + reports/coverage_baseline.json 只升不降基线，回退即失败）
      - run: python scripts/test_report.py --from-artifacts
  # 4.0.0-F0-2 / 40-d: 双端版本/发布流水线单源 — 版本单源一致性门禁
  # version.json = package.json = package-lock.json = VERSION，任一漂移即失败
  # 仅用 Python 标准库（check_version.py），无需 npm ci / pip install，可与 check 并行
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/check_version.py
  # V3.2.1-T11-4: Electron E2E（构建产物启动冒烟 + 主题色切换）
  # V3.2.2-R11.4: 扩展业务链路 E2E（建项目→渲染→导出→落位），生成拓扑需 Python 引擎
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      # 业务链路 E2E 的 design:generate/render:exportConnections 走 Python 引擎
      - run: pip install -r backend/requirements-dev.txt
      # E2E 启动需 dist-electron/main.js（package.json main 入口），先编译主进程/preload
      - run: npm run build:electron
      # E2E 以 dev 模式启动（playwright webServer 拉起 vite :5174）
      # Electron 系统依赖（libgtk/gconf 等）；electron 二进制随 npm ci 安装
      - run: sudo npx playwright install-deps
      - run: xvfb-run --auto-servernum npx playwright test
