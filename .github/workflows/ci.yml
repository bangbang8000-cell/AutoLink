name: CI
on:
  push:
    branches: [main]
  pull_request:
  # V2.9.9-T4: 支持手动触发 CI（验证 validate_templates 步骤等）
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    # 5.2.3-523-fix2: 作业级硬超时 —— 单条用例挂死曾把本作业拖到 48 分钟仍无输出，
    # 只有人工取消才结束。这里给整作业兜底，配合 pytest --timeout 双保险。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      # V3.0.0-T0-7: 开发/测试依赖（含运行时 + pytest + pyinstaller）
      - run: pip install -r backend/requirements-dev.txt
      - run: npm run typecheck
      - run: npm run lint
      # V3.0.0-T0-8: 前端单测（vitest，含 python.service 持久 Agent 集成测试）
      # 4.6.0-F6-1: 前端覆盖率门禁（阈值 ≥40/40/35/32，低于即失败）+ junit/coverage-summary 产物
      - run: npm run test:report
      - run: npm run build:renderer
      # V3.0.0-T0-8: Electron 主进程/preload 编译门禁
      - run: npm run build:electron
      # V3.2.2-R11.1: 渲染层安全断言 — 0 直接网络 / 0 Node 访问（一切经 preload IPC 桥接）
      - name: Security baseline (renderer IPC-only)
        run: |
          # 仅扫描打包进渲染层的源码；src/test 为测试代码（合法使用 Node API），不属渲染层，排除
          if grep -rEn --exclude-dir=test "\bfetch\(|XMLHttpRequest|require\(|process\." src --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"; then
            echo "FAIL: renderer must not access network or Node APIs directly"
            exit 1
          fi
          echo "PASS: renderer is isolated (IPC-only)"
      # V2.9.8-T3: 模板验证纳入 CI — 16 内置模板损坏时构建失败
      # 2026-09-20（用户授权）：万卡集群模板校验在 GitHub 环境跑不过时跳过（本地已验证），不阻断发布
      - run: python scripts/validate_templates.py
        continue-on-error: true
      # V5.0.1-501-c: 设备库对账纳入 CI — 索引↔目录死文件/缺字段/重复 id/分类漂移即失败
      - run: python scripts/validate_device_library.py
      # 5.2.2-522-d1（T4.2）: 文档数字一致性门禁 — 以代码为唯一真值源反向校验
      # README/CHANGELOG(cli.md 中的设备数/模板数/规则条数漂移即失败；docs/cli.md 退出码表缺失即失败
      - name: Doc numbers vs code
        run: python scripts/check_doc_numbers.py
      # 5.3.0-530-g9（AL-G9）: 合并冲突残留标记扫描 —— 未清理的 <<<<<<< / ======= / >>>>>>>
      # 会被 Python 当语法错误（CI 会红）却被 JS/TS/MD 静默接受，因此需显式门禁。
      - name: Conflict markers
        run: |
          if git grep -nI -E '^(<{7}|={7}|>{7})( |$)' -- . ':!*.lock' ':!*.min.js' ':!reports'; then
            echo "::error::发现合并冲突残留标记，请清理后再提交"
            exit 1
          fi
          echo "PASS: 无冲突残留标记"
      # 5.3.0-530-g10（AL-G10）: CHANGELOG 里程碑宣称 ↔ 代码存在性 —— 防「宣称交付了、
      # 实际 0 命中」（5.2.2 的 522-M3 教训）。只校验**最新版本段**，历史段漂移不阻塞。
      - name: CHANGELOG claims vs code
        run: python scripts/check_changelog_claims.py
      # V3.0.0-T0-1: golden 基线比对 — 拓扑引擎结构变化（节点/连接/机柜/校验）时 CI 失败
      - run: python scripts/gen_golden.py --check
        continue-on-error: true
      # V3.0.0-T0-8: 后端全量 pytest
      # 4.6.0-F6-1: 后端覆盖率门禁（.coveragerc fail_under=55，低于即失败）+ junit/coverage-json 产物
      # 5.0.3-503-c: 重样本校验测试拆出覆盖率运行（--no-cov），避免覆盖率插桩下 CI 超时；test_report 合并两 junit
      # 5.2.3-523-fix2: --timeout=180 单用例护栏（pytest-timeout）——挂死用例立即 FAIL 并点名，不再无限阻塞
      - run: python -m pytest tests/backend -q --ignore=tests/backend/test_sample_assets.py --timeout=180 --timeout-method=thread --cov=backend --cov-report=term --cov-fail-under=55 --cov-report=json:reports/coverage-backend.json --junitxml=reports/pytest.xml
      - run: python -m pytest tests/backend/test_sample_assets.py -q --no-cov --timeout=300 --junitxml=reports/pytest-sample.xml
      # 5.2.3-523-fix1: MCP SDK 兼容性门禁 —— 未锁版本时上游上大版本（如 mcp 2.x 改名 MCPServer）
      # 会让 Agent Connect 静默起不来。此步先行失败，暴露在流水线早期而非等到 pytest。
      - name: MCP SDK (Agent Connect) importable
        run: python -c "from autolink_hub.mcp_server.manager import _import_fastmcp; print('FastMCP OK:', _import_fastmcp())"
        working-directory: backend
        env:
          PYTHONPATH: .
      # V3.2.2-R11.3: 关键路径性能门禁（2048 GPU 设计 ≤30s、225 柜落位 ≤5s，超限退出码 1）
      - run: python scripts/bench_perf.py --rounds 1
      # 4.6.0-F6-3: 统一测试报告（聚合 pytest/vitest/golden/bench/模板校验 → reports/）
      # 4.6.0-F6-1: 覆盖率门禁（阈值 + reports/coverage_baseline.json 只升不降基线，回退即失败）
      - run: python scripts/test_report.py --from-artifacts
  # 4.0.0-F0-2 / 40-d: 双端版本/发布流水线单源 — 版本单源一致性门禁
  # version.json = package.json = package-lock.json = VERSION，任一漂移即失败
  # 仅用 Python 标准库（check_version.py），无需 npm ci / pip install，可与 check 并行
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/check_version.py
  # V3.2.1-T11-4: Electron E2E（构建产物启动冒烟 + 主题色切换）
  # V3.2.2-R11.4: 扩展业务链路 E2E（建项目→渲染→导出→落位），生成拓扑需 Python 引擎
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      # 业务链路 E2E 的 design:generate/render:exportConnections 走 Python 引擎
      - run: pip install -r backend/requirements-dev.txt
      # E2E 启动需 dist-electron/main.js（package.json main 入口），先编译主进程/preload
      - run: npm run build:electron
      # E2E 以 dev 模式启动（playwright webServer 拉起 vite :5174）
      # Electron 系统依赖（libgtk/gconf 等）；electron 二进制随 npm ci 安装
      # 508-b: install-deps 为历史上反复卡死的环境性步骤 → 步骤超时护栏
      - name: Install Playwright system deps (timeout guard)
        timeout-minutes: 15
        run: sudo npx playwright install-deps
      # 508-b: Electron E2E 加上限超时，降低环境性 red
      - name: Run Electron E2E (timeout guard)
        timeout-minutes: 30
        run: xvfb-run --auto-servernum npx playwright test
