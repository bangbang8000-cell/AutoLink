name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx electron-builder --win --publish=never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug - list output directories
        run: |
          echo "=== dist ==="
          ls -R dist/ 2>/dev/null || echo "(not found)"
          echo "=== dist-electron ==="
          ls -R dist-electron/ 2>/dev/null || echo "(not found)"
          echo "=== release ==="
          ls -R release/ 2>/dev/null || echo "(not found)"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: AutoLink-win
          path: release/*.{exe,blockmap,yml}
          retention-days: 30
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          find release -name "builder-debug.yml" -delete || true
          gh release create "${{ github.ref_name }}" \
            release/*/*.exe \
            release/*/*.blockmap \
            release/*/*.yml \
            --title "${{ github.ref_name }}" \
            --generate-notes
