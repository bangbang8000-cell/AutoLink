name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            build_flag: '--win'
            artifact_name: AutoLink-win
          - os: macos-latest
            platform: mac
            build_flag: '--mac'
            artifact_name: AutoLink-mac
          - os: ubuntu-latest
            platform: linux
            build_flag: '--linux'
            artifact_name: AutoLink-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # V3.0.0: 后端 PyInstaller 打包需要 Python 环境
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # V3.0.0: 安装后端打包依赖（pytest/pyinstaller 等）
      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Build app (renderer + electron)
        run: npm run build

      # V3.0.0: PyInstaller 单目录打包后端 engine（python.service 免 Python 运行，产物进 dist/backend-dist）
      - name: Build backend (PyInstaller)
        run: python -m PyInstaller scripts/pyinstaller.spec

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.build_flag }} --publish=never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code signing (no certificate in CI)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # V3.2.2-R11.5: Windows 代码签名（可选启用）。
          # 配置仓库 secrets CSC_LINK（pfx base64）与 CSC_KEY_PASSWORD 后，
          # electron-builder 自动签名 NSIS 安装包（SmartScreen 白名单）；
          # 未配置时保持未签名（已知限制，latest.yml 哈希仍保证下载完整性）。
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: List release artifacts
        shell: bash
        run: |
          echo "=== release/ ==="
          ls -la release/ 2>/dev/null || echo "(empty or not found)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List downloaded artifacts
        shell: bash
        run: find release -type f | sort

      # V3.0.2: Release 说明取自 CHANGELOG.md 对应版本段落（替代 --generate-notes）
      - name: Extract release notes from CHANGELOG
        run: python3 scripts/extract_release_notes.py "${{ github.ref_name }}" CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete existing release if re-running
          gh release delete "${{ github.ref_name }}" --yes || true

          # Remove non-distributable files
          find release -name "builder-debug.yml" -delete || true
          find release -name "builder-effective-config.yaml" -delete || true

          # Collect all distributable files
          gh release create "${{ github.ref_name }}" \
            release/AutoLink-win/*.exe \
            release/AutoLink-win/*.blockmap \
            release/AutoLink-win/*.yml \
            release/AutoLink-mac/*.dmg \
            release/AutoLink-mac/*.blockmap \
            release/AutoLink-mac/*.yml \
            release/AutoLink-linux/*.AppImage \
            release/AutoLink-linux/*.deb \
            release/AutoLink-linux/*.yml \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md
