[DEFAULT]
# ===== 下行端口模式 =====
# full: 满接 — 参数/存储按交换机一半口, 业务按45/组, OOB按48
# custom: 自定义 — 使用下方各网络的 downlink_limit
downlink_mode = custom

# ===== 服务器配置 =====
# GPU服务器数量 (仅GPU，接参数网400G)
num_servers = 100

# 额外服务器 (存储+通算, 不接参数网, 接OOB/业务/存储)
additional_storage_servers = 14
additional_compute_servers = 20

# 每台GPU服务器参数网卡数
param_ports_per_server = 8

# 每台服务器存储网卡数
storage_ports_per_server = 1

# ===== 交换机端口配置 =====
# 参数网络交换机端口数 (64口)
param_switch_ports = 64

# 存储网络交换机端口数 (40口)
storage_switch_ports = 40

# ===== 网络速度 =====
param_speed = 400G
storage_speed = 200G

# ===== custom模式: 各网络下行端口限制 =====
# 参数Leaf下联口数 (full模式自动=switch_ports/2=32)
param_downlink_limit = 25

# 存储Leaf下联口数 (full模式自动=switch_ports/2=20)
storage_downlink_limit = 20

# 业务接入下联口数 (full模式自动=45)
biz_downlink_limit = 25

# OOB接入下联口数 (full模式自动=48)
oob_downlink_limit = 25

# ===== 线缆类型 =====
# 参数网络服务器到Leaf的线缆类型
cable_param_server_leaf = MPO

# 参数网络Leaf到Spine的线缆类型
cable_param_leaf_spine = MPO

# 参数网络Spine到Core的线缆类型
cable_param_spine_core = MPO

# 存储网络服务器到Leaf的线缆类型
cable_storage_server_leaf = AOC

# 存储网络Leaf到Spine的线缆类型
cable_storage_leaf_spine = AOC

# 存储网络Spine到Core的线缆类型
cable_storage_spine_core = MPO

# ===== 带外管理网络 (OOB) =====
oob_enabled = true

# 带外接入交换机端口数
oob_access_ports = 48

# 带外接入交换机上联端口数
oob_access_uplinks = 2

# 带外汇聚交换机端口数
oob_agg_ports = 48

# 带外网络端口速度
oob_speed = 1G

# 带外网络上联速度
oob_uplink_speed = 10G

# 带外线缆类型
cable_oob_server_access = 网线
cable_oob_access_agg = 光纤

# ===== 业务网络 (Business) =====
biz_enabled = true

# 业务网络端口速度 (10G或25G)
biz_port_speed = 25G

# 业务接入交换机下联端口数
biz_access_ports = 48

# 业务接入交换机上联端口数
biz_access_uplinks = 8

# 业务上联速度
biz_uplink_speed = 100G

# 业务盒式汇聚交换机端口数 (N<=128时使用)
biz_agg_box_ports = 32

# 业务框式汇聚每框端口数 (N>128时使用)
biz_agg_chassis_ports = 32

# 业务线缆类型
cable_biz_server_access = 光纤
cable_biz_access_agg = 光纤